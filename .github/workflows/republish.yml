name: Republish CDN

# Rebuilds the CDN layout of an already-released version and publishes it to
# R2 without rebuilding anything: a rebuild would change manifest.json, whose
# sha256 the arcbox daemon pins in assets.lock. Sources, per manifest entry:
#
#   kernel, rootfs.erofs, manifest.json   the GitHub Release (tarballs + merged manifest)
#   upstream runtime binaries              re-downloaded by `sync-binaries` from the tag's upstream.toml
#   FEX, patched containerd                the release run's boot-assets-release-<arch> artifacts
#                                          (built in-workflow, 14-day retention) — pass that run's id
#
# Every object is checked against the manifest's sha256 before anything is
# uploaded, so a stale artifact or a moved upstream download fails the run
# instead of publishing bytes the daemon would reject.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to republish (e.g. 0.8.7)"
        required: true
        type: string
      run_id:
        description: >-
          Release workflow run whose boot-assets-release-* artifacts carry the
          in-workflow-built binaries (FEX, containerd). Required while the
          manifest lists such binaries.
        required: false
        type: string
      update_latest:
        description: "Point latest.json at this version"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  republish:
    name: Republish v${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # The tag's tree, so sync-binaries reads the upstream.toml that release
      # was built from.
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-x86_64-cargo-

      - name: Build CLI
        run: cargo build --release --features build --no-default-features

      - name: Download release assets
        run: |
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'boot-assets-*.tar.gz' \
            --pattern 'boot-assets-*.tar.gz.sha256' \
            --pattern manifest.json
          cd release
          for f in *.sha256; do
            shasum -a 256 -c "$f"
          done

      - name: Stage kernel, rootfs and manifest
        run: |
          STAGING=cdn-staging
          for ARCH in arm64 x86_64; do
            mkdir -p "$STAGING/asset/v${VERSION}/${ARCH}"
            tar -xzf "release/boot-assets-${ARCH}-v${VERSION}.tar.gz" \
              -C "$STAGING/asset/v${VERSION}/${ARCH}/" kernel rootfs.erofs
          done
          cp release/manifest.json "$STAGING/asset/v${VERSION}/manifest.json"
          if [ "${{ inputs.update_latest }}" = "true" ]; then
            printf '{"version":"%s"}\n' "$VERSION" > "$STAGING/latest.json"
          fi

      - name: Restore in-workflow-built binaries from the release run
        if: inputs.run_id != ''
        run: |
          for ARCH in arm64 x86_64; do
            gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
              --name "boot-assets-release-${ARCH}" --dir "artifacts/${ARCH}"
            if [ -d "artifacts/${ARCH}/bin" ]; then
              mkdir -p cdn-staging/bin
              cp -a "artifacts/${ARCH}/bin/." cdn-staging/bin/
            fi
          done

      # Re-downloaded rather than taken from the run artifacts so a republish
      # still works once those expire; the manifest check below is what proves
      # the bytes are the released ones.
      - name: Sync upstream runtime binaries
        run: |
          ./target/release/boot-assets sync-binaries \
            --config upstream.toml \
            --output cdn-staging/bin

      - name: Verify staging against the manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          version = os.environ["VERSION"]
          root = pathlib.Path("cdn-staging")
          manifest = json.loads((root / "asset" / f"v{version}" / "manifest.json").read_text())

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          expected = {}
          for target in manifest["targets"].values():
              for key in ("kernel", "rootfs"):
                  expected[target[key]["path"]] = target[key]["sha256"]
          for binary in manifest["binaries"]:
              for entry in binary["targets"].values():
                  expected[entry["path"]] = entry["sha256"]

          problems = []
          for rel, digest in sorted(expected.items()):
              path = root / rel
              if not path.is_file():
                  problems.append(f"missing   {rel}")
              elif (actual := sha256(path)) != digest:
                  problems.append(f"mismatch  {rel}: {actual} != {digest}")
          if problems:
              print("\n".join(problems))
              sys.exit("staging does not match the released manifest")
          print(f"verified {len(expected)} objects against manifest.json")
          PY

      - name: Publish to R2
        uses: arcboxlabs/actions/r2-publish@v1
        with:
          account-id: ${{ vars.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: arcboxcdn-boot
          source-dir: cdn-staging
          index-files: ${{ inputs.update_latest && 'latest.json' || '' }}
          strict-verify: "true"
          verify-urls: |
            https://boot.arcboxcdn.com/asset/v${{ inputs.version }}/manifest.json
            https://boot.arcboxcdn.com/asset/v${{ inputs.version }}/arm64/kernel
            https://boot.arcboxcdn.com/asset/v${{ inputs.version }}/x86_64/rootfs.erofs
