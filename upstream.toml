# upstream.toml — declares upstream binary sources for ArcBox runtime.
#
# `boot-assets sync-binaries` reads this file, downloads missing binaries
# from upstream, and stages them for R2 upload.
#
# R2 layout: bin/{name}/{version}/{arch}/{name}
# These are Linux static binaries shared into the guest VM via VirtioFS.
#
# IMPORTANT: dockerd, containerd, containerd-shim-runc-v2, runc, and
# docker-init MUST all be the same Docker release to guarantee ABI/protocol
# compatibility. Do NOT mix versions from different sources.
#
# containerd is the one exception, and it does not mix versions: it is built
# from the SAME upstream tag Docker bundles, plus one patch, by
# `boot-assets build containerd` in the release workflow (see
# src/build/containerd.rs for why, and for when to delete it). That is why
# there is no [[binaries]] entry for it below — it enters the manifest from
# the build job instead of from this file. When bumping the Docker version
# here, bump DEFAULT_CONTAINERD_REF in src/cli/build/containerd.rs to the
# containerd release the new Docker package bundles, or the guest gets a
# containerd its dockerd never shipped with.

# --- Docker static package (all from the same tarball) ---

[[binaries]]
name = "dockerd"
version = "29.7.2"

[binaries.source.arm64]
url = "https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz"
extract = "docker/dockerd"

[binaries.source.x86_64]
url = "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz"
extract = "docker/dockerd"

# containerd is built from source with our patch — see the header. It is
# intentionally absent here.

[[binaries]]
name = "containerd-shim-runc-v2"
version = "29.7.2"

[binaries.source.arm64]
url = "https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz"
extract = "docker/containerd-shim-runc-v2"

[binaries.source.x86_64]
url = "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz"
extract = "docker/containerd-shim-runc-v2"

[[binaries]]
name = "runc"
version = "29.7.2"

[binaries.source.arm64]
url = "https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz"
extract = "docker/runc"

[binaries.source.x86_64]
url = "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz"
extract = "docker/runc"

[[binaries]]
name = "docker-init"
version = "29.7.2"

[binaries.source.arm64]
url = "https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz"
extract = "docker/docker-init"

[binaries.source.x86_64]
url = "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz"
extract = "docker/docker-init"

[[binaries]]
name = "k3s"
version = "v1.36.2+k3s1"

[binaries.source.arm64]
format = "binary"
url = "https://github.com/k3s-io/k3s/releases/download/v1.36.2%2Bk3s1/k3s-arm64"

[binaries.source.x86_64]
format = "binary"
url = "https://github.com/k3s-io/k3s/releases/download/v1.36.2%2Bk3s1/k3s"

# --- Firecracker VMM + jailer (from same release tarball) ---

[[binaries]]
name = "firecracker"
version = "1.16.1"

[binaries.source.arm64]
url = "https://github.com/firecracker-microvm/firecracker/releases/download/v1.16.1/firecracker-v1.16.1-aarch64.tgz"
extract = "release-v1.16.1-aarch64/firecracker-v1.16.1-aarch64"

[binaries.source.x86_64]
url = "https://github.com/firecracker-microvm/firecracker/releases/download/v1.16.1/firecracker-v1.16.1-x86_64.tgz"
extract = "release-v1.16.1-x86_64/firecracker-v1.16.1-x86_64"

[[binaries]]
name = "jailer"
version = "1.16.1"

[binaries.source.arm64]
url = "https://github.com/firecracker-microvm/firecracker/releases/download/v1.16.1/firecracker-v1.16.1-aarch64.tgz"
extract = "release-v1.16.1-aarch64/jailer-v1.16.1-aarch64"

[binaries.source.x86_64]
url = "https://github.com/firecracker-microvm/firecracker/releases/download/v1.16.1/firecracker-v1.16.1-x86_64.tgz"
extract = "release-v1.16.1-x86_64/jailer-v1.16.1-x86_64"

# --- Guest kernel image (for Firecracker microVMs) ---
# Placed at /arcbox/kernel/vmlinux inside the guest VM.
#
# Both arches are the arcbox `microvm` kernel flavor: a dedicated
# minimal sandbox kernel targeting kernel-entry -> PID 1 in the
# 200-300 ms class. arm64 boots nested inside the macOS System VM (DT
# discovery, Image artifact, no ACPI); x86_64 boots on bare-metal Linux
# KVM hosts via Firecracker's hardware-reduced ACPI (DSDT-enumerated
# virtio-mmio, ELF vmlinux artifact) and requires Firecracker >= 1.8.
# The version string keys the immutable CDN path
# (bin/vmlinux/{version}/{arch}/vmlinux) and must change whenever the
# kernel bytes change, so rollback = revert this pin.

[[binaries]]
name = "vmlinux"
version = "0.0.24-microvm"
install_dir = "kernel"

[binaries.source.arm64]
format = "binary"
url = "https://github.com/arcboxlabs/kernel/releases/download/v0.0.24/microvm-kernel-arm64"

[binaries.source.x86_64]
format = "binary"
url = "https://github.com/arcboxlabs/kernel/releases/download/v0.0.24/microvm-kernel-x86_64"
